name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create validator virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r validator/requirements.txt
      - run: npm ci
      - run: npm run validate
